name: Temporary exposure check
on:
  push:
    branches: [claude/diag-500]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Direct access to unmoderated photos (status codes only)
        run: |
          python3 - <<'PY'
          import json, urllib.request, ssl
          cities = json.load(open('main/citylist.json'))
          def req(url, method='HEAD'):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, method=method, headers={'User-Agent': 'vigilo-conf check'}), timeout=20)
                  return r.status, r.headers.get('Content-Type', ''), r.read(4000) if method == 'GET' else b''
              except urllib.error.HTTPError as e:
                  return e.code, '', b''
              except Exception as e:
                  return 'ERR ' + str(e)[:40], '', b''
          print('| Instance | Backend | Unmoderated in list | images/<token>.jpg | images/ listing | get_photo (approved) |')
          for name, c in cities.items():
              base = c['api_path'].rstrip('/')
              try:
                  issues = json.load(urllib.request.urlopen(base + '/get_issues.php?scope=' + c['scope'] + '&count=200', timeout=30))
              except Exception as e:
                  print('|', name, '| ? | error', str(e)[:40], '| | | |'); continue
              unmod = [i for i in issues if str(i.get('approved')) == '0']
              appr = [i for i in issues if str(i.get('approved')) == '1']
              ver = req(base + '/get_version.php', 'GET')[2][:200].decode('utf-8', 'replace').replace('\n', ' ')
              direct = req(base + '/images/' + unmod[0]['token'] + '.jpg')[0] if unmod else (str(req(base + '/images/' + appr[0]['token'] + '.jpg')[0]) + ' (approved)' if appr else '-')
              st, ct, body = req(base + '/images/', 'GET')
              listing = 'LISTING' if b'Index of' in body or b'.jpg' in body else st
              gp = req(base + '/get_photo.php?token=' + appr[0]['token'])[0] if appr else '-'
              print('|', name, '|', ver, '|', len(unmod), '|', direct, '|', listing, '|', gp, '|')
          PY
