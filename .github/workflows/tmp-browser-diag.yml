name: Temporary browser diagnostic
on:
  push:
    branches: [claude/deeper-check]
    paths: ['.github/workflows/tmp-browser-diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Load the real pages
        run: |
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const pages = [
            ['site Aix', 'https://vigilo.city/fr/villes/aix-marseille-provence-metropole-fr/', '#observations-status'],
            ['site Montpellier', 'https://vigilo.city/fr/villes/grand-montpellier-fr/', '#observations-status'],
            ['app Aix', 'https://app.vigilo.city/?instance=' + encodeURIComponent('Aix Marseille Provence Metropole'), '#issues .cards-container'],
            ['site Villes', 'https://vigilo.city/fr/villes/', '.instances-grid'],
          ];
          for (const [label, url, sel] of pages) {
            const page = await browser.newPage();
            const log = [];
            page.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') log.push(m.type() + ': ' + m.text().slice(0, 200)); });
            page.on('pageerror', e => log.push('pageerror: ' + e.message.slice(0, 200)));
            page.on('requestfailed', r => log.push('failed: ' + r.url().slice(0, 120) + ' ' + (r.failure() || {}).errorText));
            page.on('response', r => { if (r.status() >= 400) log.push('HTTP ' + r.status() + ': ' + r.url().slice(0, 120)); });
            const t0 = Date.now();
            try { await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }); } catch (e) { log.push('goto: ' + e.message.slice(0, 150)); }
            await page.waitForTimeout(5000);
            let text = '';
            try { text = (await page.locator(sel).first().innerText({ timeout: 5000 })).replace(/\s+/g, ' ').slice(0, 300); } catch (e) { text = 'selector not found'; }
            console.log('=== ' + label + ' (' + url + ') ' + (Date.now() - t0) + ' ms');
            console.log('TEXT: ' + text);
            if (label === 'app Aix') console.log('CARDS: ' + await page.locator('#issues .card').count());
            if (label === 'site Villes') console.log('CARDS: ' + (await page.locator('.instance-card').allInnerTexts()).map(t => t.replace(/\s+/g, ' ')).join(' || '));
            console.log(log.slice(0, 25).join('\n'));
            await page.close();
          }
          await browser.close();
          JS
          node diag.mjs
